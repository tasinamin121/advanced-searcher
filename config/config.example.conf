# Advanced Searcher Configuration
# Copy this file to /etc/advanced-searcher/config.conf and customize as needed

# Access Control
# Only allow root access to the plugin
root_only=true

# Search Settings
# Maximum number of results to return per search
max_results=100

# Enable caching of search results
enable_cache=true

# Cache time-to-live in seconds (3600 = 1 hour)
cache_ttl=3600

# Logging
# Log level: debug, info, warning, error, critical
log_level=info

# Enable debug mode (additional logging)
enable_debug=false

# Update Checking
# Check for plugin updates automatically
check_updates=false

# Update check interval in seconds (86400 = 24 hours)
update_check_interval=86400

# Security
# Enable rate limiting for API requests
enable_rate_limiting=true

# Maximum requests per minute per user
rate_limit_per_minute=60

# UI Settings
# Number of results per page in web interface
results_per_page=50

# Enable autocomplete suggestions
enable_autocomplete=true

# Maximum autocomplete suggestions
max_autocomplete_suggestions=10